[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dryhack-mcp"
version = "2.0.1"
description = "DryHack-MCP - an MCP server providing offensive-security tooling (curl, python, shell) and an AI-driven recommend_action engine for authorized penetration testing."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [{ name = "Afrizal F.A" }]
keywords = ["mcp", "penetration-testing", "security", "offensive-security", "red-team"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security",
]
dependencies = [
    "mcp>=1.2.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.1"]

[project.scripts]
dryhack-mcp = "dryhack_mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/afrizalfarhan/DryHack-MCP"
Repository = "https://github.com/afrizalfarhan/DryHack-MCP"

[tool.setuptools.packages.find]
where = ["."]
include = ["dryhack_mcp*"]
